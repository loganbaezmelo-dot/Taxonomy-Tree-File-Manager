<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Taxonomy Bounty Hunter - Sudden Death Mode</title>
  <style>
    :root {
      --bg: #090a0f;
      --panel: #11131c;
      --hover: #1c2030;
      --text: #cdd6f4;
      --muted: #585b70;
      --accent: #89b4fa;
      --win: #a6e3a1;
      --folder: #f9e2af;
      --border: #181b28;
      --danger: #f38ba8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      user-select: none;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 10px;
    }

    .window {
      width: 100%;
      max-width: 1150px;
      height: 820px;
      background: var(--panel);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border: 1px solid var(--border);
      box-shadow: 0 20px 60px rgba(0,0,0,0.9);
    }

    .header {
      background: #05060a;
      padding: 12px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
    }

    .controls {
      display: flex;
      gap: 8px;
    }

    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
    }
    .dot-red { background: var(--danger); }
    .dot-yellow { background: var(--folder); }
    .dot-green { background: var(--win); }

    .bounty-banner {
      background: #1e1e2e;
      padding: 12px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 2px solid var(--accent);
    }

    .bounty-text {
      font-size: 0.95rem;
      font-weight: bold;
      color: var(--text);
    }

    .bounty-target {
      color: var(--folder);
      text-decoration: underline;
    }

    .stats-bar {
      display: flex;
      gap: 16px;
      font-size: 0.85rem;
      font-family: monospace;
    }

    .timer-danger {
      color: var(--danger) !important;
      animation: pulse 0.6s infinite alternate;
    }

    @keyframes pulse {
      from { transform: scale(1); }
      to { transform: scale(1.15); }
    }

    .stat-val {
      color: var(--accent);
      font-weight: bold;
    }

    .penalty-flash {
      position: fixed;
      top: 20px;
      right: 20px;
      background: var(--danger);
      color: #05060a;
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: bold;
      font-family: monospace;
      font-size: 1.1rem;
      box-shadow: 0 4px 20px rgba(243, 139, 168, 0.6);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s, transform 0.2s;
      transform: translateY(-10px);
      z-index: 200;
    }

    .penalty-flash.show {
      opacity: 1;
      transform: translateY(0);
    }

    .nav {
      padding: 10px 16px;
      background: var(--panel);
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid var(--border);
    }

    .btn {
      background: #1c2030;
      border: none;
      color: var(--text);
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: 0.15s;
    }

    .btn:hover:not(:disabled) {
      background: var(--accent);
      color: #05060a;
    }

    .btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    .breadcrumbs {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #05060a;
      padding: 6px 12px;
      border-radius: 6px;
      flex-grow: 1;
      font-size: 0.8rem;
      color: var(--muted);
      overflow-x: auto;
      white-space: nowrap;
    }

    .grid {
      flex-grow: 1;
      padding: 20px;
      overflow-y: auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      grid-auto-rows: max-content;
      gap: 12px;
    }

    .node {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px 4px;
      border-radius: 8px;
      cursor: pointer;
      text-align: center;
      transition: background 0.15s, transform 0.1s;
      border: 1px solid transparent;
    }

    .node:hover {
      background: var(--hover);
      border-color: var(--border);
      transform: translateY(-2px);
    }

    .node-icon {
      font-size: 32px;
      margin-bottom: 6px;
    }

    .node-name {
      font-size: 0.75rem;
      word-break: break-word;
      line-height: 1.2;
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      align-items: center;
      justify-content: center;
      z-index: 100;
    }

    .modal.active {
      display: flex;
    }

    .modal-box {
      background: var(--panel);
      border: 1px solid var(--accent);
      border-radius: 12px;
      max-width: 650px;
      width: 90%;
      padding: 24px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.9);
      display: flex;
      flex-direction: column;
      max-height: 85vh;
    }

    .modal-title {
      font-size: 1.3rem;
      color: var(--accent);
      margin-bottom: 12px;
    }

    .wiki-preview {
      display: flex;
      gap: 14px;
      align-items: center;
      margin-bottom: 12px;
      background: #05060a;
      padding: 10px;
      border-radius: 8px;
    }

    .wiki-img {
      width: 70px;
      height: 70px;
      object-fit: cover;
      border-radius: 6px;
      border: 1px solid var(--border);
      flex-shrink: 0;
    }

    .wiki-meta {
      font-size: 0.85rem;
      color: var(--text);
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .modal-content {
      background: #05060a;
      padding: 14px;
      border-radius: 8px;
      font-family: monospace;
      color: var(--text);
      font-size: 0.85rem;
      line-height: 1.45;
      margin-bottom: 18px;
      white-space: pre-wrap;
      overflow-y: auto;
      flex-grow: 1;
      user-select: text;
    }

    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid var(--accent);
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div id="penaltyFlash" class="penalty-flash">⚠️ WRONG PATH: -5.0s</div>

  <div class="window">
    <div class="header">
      <div class="controls">
        <div class="dot dot-red"></div>
        <div class="dot dot-yellow"></div>
        <div class="dot dot-green"></div>

      <div class="stats-bar">

        <span>DEPTH: <span id="depthVal" class="stat-val">0 / 8</span></span>
      </div>
      <div></div>
    </div>

    <div class="bounty-banner">
      <div class="bounty-text">🎯 TARGET BOUNTY: <span id="targetName" class="bounty-target">Loading...</span></div>
      <button class="btn" style="background: var(--folder); color: #05060a;" onclick="initGame()">🎲 Re-Roll Target</button>
    </div>

    <div class="nav">
      <button id="backBtn" class="btn" disabled>← Up</button>
      <div id="breadcrumb" class="breadcrumbs">📁 Root</div>
    </div>

    <div id="grid" class="grid"></div>
  </div>

  <div id="modal" class="modal">
    <div class="modal-box">
      <div id="modalTitle" class="modal-title">File Inspector</div>
      <div id="wikiHeader" class="wiki-preview" style="display: none;">

        <div class="wiki-meta">
          <strong id="wikiHeading" style="color: var(--accent);"></strong>
          <span id="wikiDescription" style="color: var(--muted); font-size: 0.75rem;"></span>
        </div>
      </div>
      <div id="modalContent" class="modal-content"></div>
      <div style="text-align: right; display: flex; gap: 8px; justify-content: flex-end;">
        <button id="restartBtn" class="btn" style="display: none; background: var(--accent); color: #05060a;" onclick="initGame(); closeModal();">Play Again</button>
        <button class="btn" style="background: var(--win); color: #05060a;" onclick="closeModal()">Close</button>
      </div>
    </div>
  </div>

    function shuffleArray(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }

    // Extract all reachable species and build path traces
    let allTargetSpecies = [];
    function extractAllSpeciesPaths(node, currentPath = []) {
      const thisPath = [...currentPath, node.name];
      const keys = ["domains", "kingdoms", "phyla", "classes", "orders", "families", "genera"];
      let nextKey = keys.find(k => node[k]);

      if (nextKey) {
        node[nextKey].forEach(sub => extractAllSpeciesPaths(sub, thisPath));
      } else if (node.species) {
        node.species.forEach(sp => {
          allTargetSpecies.push({
            name: sp.name,
            file: sp.file,
            wikiQuery: sp.wikiQuery,
            common: sp.common || sp.name,
            fullPath: [...thisPath, sp.name]
          });
        });
      }
    }
    extractAllSpeciesPaths(taxonomyData);

    let activeBounty = null;
    let targetPath = [];
    let fileSystem = null;
    let navStack = [];

    let timeLeft = 30.0;
    let timerInterval = null;
    let isGameOver = false;
    let mistakes = 0;

    const gridEl = document.getElementById("grid");
    const breadcrumbEl = document.getElementById("breadcrumb");
    const backBtn = document.getElementById("backBtn");
    const timerValEl = document.getElementById("timerVal");
    const mistakeValEl = document.getElementById("mistakeVal");
    const depthValEl = document.getElementById("depthVal");
    const targetNameEl = document.getElementById("targetName");
    const penaltyFlashEl = document.getElementById("penaltyFlash");

    const modalEl = document.getElementById("modal");
    const modalTitle = document.getElementById("modalTitle");
    const modalContent = document.getElementById("modalContent");
    const wikiHeader = document.getElementById("wikiHeader");
    const wikiImg = document.getElementById("wikiImg");
    const wikiHeading = document.getElementById("wikiHeading");
    const wikiDescription = document.getElementById("wikiDescription");
    const restartBtn = document.getElementById("restartBtn");

    function buildTree(raw) {
      function parseNode(node) {
        const item = { name: node.name, type: "folder", children: [] };
        const keys = ["domains", "kingdoms", "phyla", "classes", "orders", "families", "genera"];
        let nextKey = keys.find(k => node[k]);

        if (nextKey) {
          item.children = node[nextKey].map(sub => parseNode(sub));
        } else if (node.species) {
          item.children = node.species.map(sp => {
            return {
              name: sp.name,
              type: "folder",
              children: [
                {
                  name: sp.file,
                  type: "file",
                  wikiQuery: sp.wikiQuery,
                  common: sp.common,
                  isTarget: (activeBounty && sp.file === activeBounty.file)
                }
              ]
            };
          });
        }
        return item;
      }
      return parseNode(raw);
    }

    function initGame() {
      clearInterval(timerInterval);
      isGameOver = false;
      mistakes = 0;
      timeLeft = 30.0;
      timerValEl.innerText = `${timeLeft.toFixed(1)}s`;
      timerValEl.classList.remove("timer-danger");
      mistakeValEl.innerText = "0";

      // Pick random bounty
      activeBounty = allTargetSpecies[Math.floor(Math.random() * allTargetSpecies.length)];
      targetPath = activeBounty.fullPath;
      targetNameEl.innerText = `${activeBounty.common} (${activeBounty.name})`;

      fileSystem = buildTree(taxonomyData);
      navStack = [fileSystem];

      renderView();

      timerInterval = setInterval(() => {
        if (isGameOver) return;
        timeLeft -= 0.1;
        if (timeLeft <= 10.0) {
          timerValEl.classList.add("timer-danger");
        }
        if (timeLeft <= 0) {
          timeLeft = 0;
          triggerGameOver(false, "⏰ TIME RAN OUT! You were swallowed by the taxonomy void 💀😭.");
        }
        timerValEl.innerText = `${timeLeft.toFixed(1)}s`;
      }, 100);
    }

    function flashPenalty() {
      penaltyFlashEl.classList.add("show");
      setTimeout(() => {
        penaltyFlashEl.classList.remove("show");
      }, 600);
    }

    function renderView() {
      const current = navStack[navStack.length - 1];
      gridEl.innerHTML = "";

      breadcrumbEl.innerText = navStack.map(n => n.name).join(" / ");
      backBtn.disabled = navStack.length <= 1;
      depthValEl.innerText = `${navStack.length - 1} / ${targetPath.length - 1}`;

      if (!current.children || current.children.length === 0) {
        gridEl.innerHTML = `<div style="grid-column: 1/-1; color: var(--muted); text-align: center; padding: 40px;">(Empty rank level)</div>`;
        return;
      }

      const displayItems = shuffleArray([...current.children]);

      displayItems.forEach(child => {
        const node = document.createElement("div");
        node.className = "node";

        const icon = child.type === "folder" ? "📁" : (child.isTarget ? "🏆" : "📄");
        node.innerHTML = `
          <div class="node-icon">${icon}</div>
          <div class="node-name">${child.name}</div>
        `;

        node.addEventListener("click", () => {
          if (isGameOver) return;

          if (child.type === "folder") {
            const currentLevel = navStack.length;
            // Check if this step diverges from target path
            if (targetPath[currentLevel] && child.name !== targetPath[currentLevel]) {
              mistakes++;
              mistakeValEl.innerText = mistakes;
              timeLeft = Math.max(0, timeLeft - 5.0);
              flashPenalty();
              if (timeLeft <= 0) {
                triggerGameOver(false, "💀 Penalty death! -5.0s penalty drained all your remaining time.");
                return;
              }
            }
            navStack.push(child);
            renderView();
          } else if (child.type === "file") {
            inspectFile(child);
          }
        });

        gridEl.appendChild(node);
      });
    }

    function triggerGameOver(won, message) {
      isGameOver = true;
      clearInterval(timerInterval);

      modalTitle.innerText = won ? "🏆 BOUNTY SECURED!" : "💀 GAME OVER";
      modalTitle.style.color = won ? "var(--win)" : "var(--danger)";
      wikiHeader.style.display = "none";
      restartBtn.style.display = "inline-block";

      let finalReport = `${message}\n\n`;
      finalReport += `Target: ${activeBounty.common} (${activeBounty.name})\n`;
      finalReport += `Required Path: ${targetPath.join(" -> ")}\n`;
      finalReport += `Wrong Path Clicks: ${mistakes}\n`;
      if (won) {
        finalReport += `Time Remaining: ${timeLeft.toFixed(1)}s\n`;
      }

      modalContent.innerText = finalReport;
      modalEl.classList.add("active");
    }

    async function fetchWikipediaData(title) {
      try {
        const url = `https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(title)}`;
        const res = await fetch(url);
        if (!res.ok) throw new Error("Lookup failed");
        return await res.json();
      } catch (e) {
        return null;
      }
    }

    async function inspectFile(file) {
      if (file.isTarget) {
        triggerGameOver(true, "🎉 You found the exact bounty target in record time!");
        return;
      }

      modalTitle.innerText = `📄 ${file.name} (WRONG TARGET)`;
      modalTitle.style.color = "var(--danger)";
      restartBtn.style.display = "none";

      wikiHeader.style.display = "none";
      modalContent.innerHTML = `<div style="display:flex; align-items:center; gap:8px;"><span class="spinner"></span> Pulling Wikipedia taxonomy dossier...</div>`;
      modalEl.classList.add("active");

      const wiki = await fetchWikipediaData(file.wikiQuery);

      if (wiki) {
        if (wiki.thumbnail && wiki.thumbnail.source) {
          wikiImg.src = wiki.thumbnail.source;
          wikiImg.style.display = "block";
        } else {
          wikiImg.style.display = "none";
        }

        wikiHeading.innerText = wiki.title || file.name;
        wikiDescription.innerText = wiki.description ? `(${wiki.description})` : "Taxon Dossier";
        wikiHeader.style.display = "flex";

        let textOutput = `⚠️ THIS IS NOT YOUR ASSIGNED BOUNTY TARGET!\n\n`;
        textOutput += `Your Target: ${activeBounty.common} (${activeBounty.name})\n`;
        textOutput += `--------------------------------------------------\n\n`;
        textOutput += `[SOURCE: Wikipedia REST API]\n\n${wiki.extract}\n\n`;
        textOutput += `Wikipedia Page: ${wiki.content_urls ? wiki.content_urls.desktop.page : `https://en.wikipedia.org/wiki/${file.wikiQuery}`}`;

        modalContent.innerText = textOutput;
      } else {
        modalContent.innerText = `[File: ${file.name}]\n\nNot your target bounty. Failed to pull Wikipedia extract.\nScientific Query: ${file.wikiQuery}`;
      }
    }

    function closeModal() {
      modalEl.classList.remove("active");
    }

    backBtn.addEventListener("click", () => {
      if (navStack.length > 1) {
        navStack.pop();
        renderView();
      }
    });

    // Start on boot
    initGame();
  </script>
</body>
</html>
