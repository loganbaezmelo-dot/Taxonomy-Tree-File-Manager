<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Taxonomy Explorer - 3 Domains Edition</title>
  <style>
    :root {
      --bg: #11111b;
      --panel: #181825;
      --hover: #313244;
      --text: #cdd6f4;
      --muted: #6c7086;
      --accent: #89b4fa;
      --win: #a6e3a1;
      --folder: #f9e2af;
      --border: #28283d;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 16px;
    }

    .window {
      width: 100%;
      max-width: 1050px;
      height: 720px;
      background: var(--panel);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border: 1px solid var(--border);
      box-shadow: 0 16px 40px rgba(0,0,0,0.6);
    }

    .header {
      background: #11111b;
      padding: 12px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
    }

    .controls {
      display: flex;
      gap: 8px;
    }

    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
    }
    .dot-red { background: #f38ba8; }
    .dot-yellow { background: var(--folder); }
    .dot-green { background: var(--win); }

    .nav {
      padding: 10px 16px;
      background: var(--panel);
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid var(--border);
    }

    .btn {
      background: #313244;
      border: none;
      color: var(--text);
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: 0.15s;
    }

    .btn:hover:not(:disabled) {
      background: var(--accent);
      color: #11111b;
    }

    .btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    .breadcrumbs {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #11111b;
      padding: 6px 12px;
      border-radius: 6px;
      flex-grow: 1;
      font-size: 0.8rem;
      color: var(--muted);
      overflow-x: auto;
      white-space: nowrap;
    }

    .grid {
      flex-grow: 1;
      padding: 20px;
      overflow-y: auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(135px, 1fr));
      grid-auto-rows: max-content;
      gap: 14px;
    }

    .node {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px 6px;
      border-radius: 8px;
      cursor: pointer;
      text-align: center;
      transition: background 0.15s, transform 0.1s;
    }

    .node:hover {
      background: var(--hover);
      transform: translateY(-2px);
    }

    .node-icon {
      font-size: 38px;
      margin-bottom: 6px;
    }

    .node-name {
      font-size: 0.8rem;
      word-break: break-word;
      line-height: 1.2;
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      align-items: center;
      justify-content: center;
      z-index: 100;
    }

    .modal.active {
      display: flex;
    }

    .modal-box {
      background: var(--panel);
      border: 1px solid var(--accent);
      border-radius: 12px;
      max-width: 650px;
      width: 90%;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      display: flex;
      flex-direction: column;
      max-height: 85vh;
    }

    .modal-title {
      font-size: 1.3rem;
      color: var(--accent);
      margin-bottom: 12px;
    }

    .wiki-preview {
      display: flex;
      gap: 14px;
      align-items: center;
      margin-bottom: 12px;
      background: #11111b;
      padding: 10px;
      border-radius: 8px;
    }

    .wiki-img {
      width: 70px;
      height: 70px;
      object-fit: cover;
      border-radius: 6px;
      border: 1px solid var(--border);
      flex-shrink: 0;
    }

    .wiki-meta {
      font-size: 0.85rem;
      color: var(--text);
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .modal-content {
      background: #11111b;
      padding: 14px;
      border-radius: 8px;
      font-family: monospace;
      color: var(--text);
      font-size: 0.85rem;
      line-height: 1.45;
      margin-bottom: 18px;
      white-space: pre-wrap;
      overflow-y: auto;
      flex-grow: 1;
      user-select: text;
    }

    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid var(--accent);
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>

  <div class="window">

    <div class="nav">

    <div id="grid" class="grid"></div>

      <div style="text-align: right;">
        <button class="btn" style="background: var(--win); color: #11111b;" onclick="closeModal()">Close</button>

  </div>

    function buildTree(raw) {
      function parseNode(node) {
        const item = { name: node.name, type: "folder", children: [] };
        
        const keys = ["domains", "kingdoms", "phyla", "classes", "orders", "families", "genera"];
        let nextKey = keys.find(k => node[k]);

        if (nextKey) {
          item.children = node[nextKey].map(sub => parseNode(sub));
        } else if (node.species) {
          item.children = node.species.map(sp => {
            return {
              name: sp.name,
              type: "folder",
              children: [
                {
                  name: sp.file,
                  type: "file",
                  wikiQuery: sp.wikiQuery,
                  isTarget: !!sp.isTarget
                }
              ]
            };
          });
        }
        return item;
      }

      return parseNode(raw);
    }

    const fileSystem = buildTree(rawTaxonomy);
    let navStack = [fileSystem];

    const gridEl = document.getElementById("grid");
    const breadcrumbEl = document.getElementById("breadcrumb");
    const backBtn = document.getElementById("backBtn");
    const modalEl = document.getElementById("modal");
    const modalTitle = document.getElementById("modalTitle");
    const modalContent = document.getElementById("modalContent");
    const wikiHeader = document.getElementById("wikiHeader");
    const wikiImg = document.getElementById("wikiImg");
    const wikiHeading = document.getElementById("wikiHeading");
    const wikiDescription = document.getElementById("wikiDescription");

    function renderView() {
      const current = navStack[navStack.length - 1];
      gridEl.innerHTML = "";

      breadcrumbEl.innerText = navStack.map(n => n.name).join(" / ");
      backBtn.disabled = navStack.length <= 1;

      if (!current.children || current.children.length === 0) {
        gridEl.innerHTML = `<div style="grid-column: 1/-1; color: var(--muted); text-align: center; padding: 40px;">(Folder empty)</div>`;
        return;
      }

      current.children.forEach(child => {
        const node = document.createElement("div");
        node.className = "node";

        const icon = child.type === "folder" ? "📁" : (child.isTarget ? "🏆" : "📄");
        node.innerHTML = `
          <div class="node-icon">${icon}</div>
          <div class="node-name">${child.name}</div>
        `;

        node.addEventListener("click", () => {
          if (child.type === "folder") {
            navStack.push(child);
            renderView();
          } else if (child.type === "file") {
            inspectFile(child);
          }
        });

        gridEl.appendChild(node);
      });
    }

    async function fetchWikipediaData(title) {
      try {
        const url = `https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(title)}`;
        const res = await fetch(url);
        if (!res.ok) throw new Error("Article lookup failed");
        return await res.json();
      } catch (e) {
        return null;
      }
    }

    async function inspectFile(file) {
      modalTitle.innerText = file.isTarget ? "🎉 OBJECTIVE FOUND: HOMO SAPIENS!" : `📄 ${file.name}`;
      modalTitle.style.color = file.isTarget ? "var(--win)" : "var(--accent)";
      
      wikiHeader.style.display = "none";
      modalContent.innerHTML = `<div style="display:flex; align-items:center; gap:8px;"><span class="spinner"></span> Querying Wikipedia servers for detailed dossier...</div>`;
      modalEl.classList.add("active");

      const wiki = await fetchWikipediaData(file.wikiQuery);

      if (wiki) {
        if (wiki.thumbnail && wiki.thumbnail.source) {
          wikiImg.src = wiki.thumbnail.source;
          wikiImg.style.display = "block";
        } else {
          wikiImg.style.display = "none";
        }

        wikiHeading.innerText = wiki.title || file.name;
        wikiDescription.innerText = wiki.description ? `(${wiki.description})` : "Wikipedia Entry";
        wikiHeader.style.display = "flex";

        let textOutput = "";
        if (file.isTarget) {
          textOutput += ">>> 🎯 WIN CONDITION TRIGGERED! 🎯 <<<\n";
          textOutput += "Lineage: Archaea / Bacteria / Eukaryota -> Eukaryota -> Animalia -> Chordata -> Mammalia -> Primates -> Hominidae -> Homo -> sapiens\n";
          textOutput += "--------------------------------------------------\n\n";
        }

        textOutput += `[SOURCE: Wikipedia REST API]\n\n${wiki.extract}\n\n`;
        textOutput += `Full Link: ${wiki.content_urls ? wiki.content_urls.desktop.page : `https://en.wikipedia.org/wiki/${file.wikiQuery}`}`;

        modalContent.innerText = textOutput;
      } else {
        modalContent.innerText = `[File: ${file.name}]\n\nFailed to pull Wikipedia extract dynamically. 💀\nSpecies target: ${file.wikiQuery}`;
      }
    }

    function closeModal() {
      modalEl.classList.remove("active");
    }

    backBtn.addEventListener("click", () => {
      if (navStack.length > 1) {
        navStack.pop();
        renderView();
      }
    });

    renderView();
  </script>
