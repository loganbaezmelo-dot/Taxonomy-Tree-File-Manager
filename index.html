<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Taxonomy Explorer - Hardcore Nightmare Edition</title>
  <style>
    :root {
      --bg: #0d0e15;
      --panel: #141622;
      --hover: #222638;
      --text: #cdd6f4;
      --muted: #6c7086;
      --accent: #89b4fa;
      --win: #a6e3a1;
      --folder: #f9e2af;
      --border: #1e2238;
      --danger: #f38ba8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      user-select: none;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 12px;
    }

    .window {
      width: 100%;
      max-width: 1100px;
      height: 760px;
      background: var(--panel);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border: 1px solid var(--border);
      box-shadow: 0 20px 50px rgba(0,0,0,0.8);
    }

    .header {
      background: #090a10;
      padding: 12px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
    }

    .controls {
      display: flex;
      gap: 8px;
    }

    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
    }
    .dot-red { background: var(--danger); }
    .dot-yellow { background: var(--folder); }
    .dot-green { background: var(--win); }

    .stats-bar {
      display: flex;
      gap: 16px;
      font-size: 0.8rem;
      color: var(--muted);
      font-family: monospace;
    }

    .stat-val {
      color: var(--accent);
      font-weight: bold;
    }

    .nav {
      padding: 10px 16px;
      background: var(--panel);
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid var(--border);
    }

    .btn {
      background: #222638;
      border: none;
      color: var(--text);
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: 0.15s;
    }

    .btn:hover:not(:disabled) {
      background: var(--accent);
      color: #090a10;
    }

    .btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    .breadcrumbs {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #090a10;
      padding: 6px 12px;
      border-radius: 6px;
      flex-grow: 1;
      font-size: 0.8rem;
      color: var(--muted);
      overflow-x: auto;
      white-space: nowrap;
    }

    .grid {
      flex-grow: 1;
      padding: 20px;
      overflow-y: auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      grid-auto-rows: max-content;
      gap: 12px;
    }

    .node {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px 6px;
      border-radius: 8px;
      cursor: pointer;
      text-align: center;
      transition: background 0.15s, transform 0.1s;
      border: 1px solid transparent;
    }

    .node:hover {
      background: var(--hover);
      border-color: var(--border);
      transform: translateY(-2px);
    }

    .node-icon {
      font-size: 34px;
      margin-bottom: 6px;
    }

    .node-name {
      font-size: 0.78rem;
      word-break: break-word;
      line-height: 1.2;
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      align-items: center;
      justify-content: center;
      z-index: 100;
    }

    .modal.active {
      display: flex;
    }

    .modal-box {
      background: var(--panel);
      border: 1px solid var(--accent);
      border-radius: 12px;
      max-width: 650px;
      width: 90%;
      padding: 24px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.9);
      display: flex;
      flex-direction: column;
      max-height: 85vh;
    }

    .modal-title {
      font-size: 1.3rem;
      color: var(--accent);
      margin-bottom: 12px;
    }

    .wiki-preview {
      display: flex;
      gap: 14px;
      align-items: center;
      margin-bottom: 12px;
      background: #090a10;
      padding: 10px;
      border-radius: 8px;
    }

    .wiki-img {
      width: 70px;
      height: 70px;
      object-fit: cover;
      border-radius: 6px;
      border: 1px solid var(--border);
      flex-shrink: 0;
    }

    .wiki-meta {
      font-size: 0.85rem;
      color: var(--text);
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .modal-content {
      background: #090a10;
      padding: 14px;
      border-radius: 8px;
      font-family: monospace;
      color: var(--text);
      font-size: 0.85rem;
      line-height: 1.45;
      margin-bottom: 18px;
      white-space: pre-wrap;
      overflow-y: auto;
      flex-grow: 1;
      user-select: text;
    }

    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid var(--accent);
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>

                                { name: "Amanita", species: [{ name: "muscaria", file: "red_white_toadstool.txt", wikiQuery: "Amanita muscaria" }, { name: "phalloides", file: "liver_destroyer.txt", wikiQuery: "Amanita phalloides" }] }
                              ]
                            },
                            {
                              name: "Psathyrellaceae",
                              genera: [
                                { name: "Coprinellus", species: [{ name: "micaceus", file: "inky_melter.txt", wikiQuery: "Coprinellus micaceus" }] }
                              ]
                            },
                            {
                              name: "Hymenogastraceae",
                              genera: [
                                { name: "Psilocybe", species: [{ name: "cubensis", file: "reality_bender.txt", wikiQuery: "Psilocybe cubensis" }] }
                              ]
                            }
                          ]
                        },
                        {
                          name: "Boletales",
                          families: [
                            {
                              name: "Boletaceae",
                              genera: [
                                { name: "Boletus", species: [{ name: "edulis", file: "king_porcini.txt", wikiQuery: "Boletus edulis" }] }
                              ]
                            }
                          ]
                        }
                      ]
                    }
                  ]
                },
                {
                  name: "Ascomycota",
                  classes: [
                    {
                      name: "Saccharomycetes",
                      orders: [
                        {
                          name: "Saccharomycetales",
                          families: [
                            {
                              name: "Saccharomycetaceae",
                              genera: [
                                { name: "Saccharomyces", species: [{ name: "cerevisiae", file: "bread_and_ale_yeast.txt", wikiQuery: "Saccharomyces cerevisiae" }] }
                              ]
                            },
                            {
                              name: "Saccharomycetaceae",
                              genera: [
                                { name: "Candida", species: [{ name: "albicans", file: "opportunistic_yeast.txt", wikiQuery: "Candida albicans" }] }
                              ]
                            }
                          ]
                        }
                      ]
                    },
                    {
                      name: "Eurotiomycetes",
                      orders: [
                        {
                          name: "Eurotiales",
                          families: [
                            {
                              name: "Aspergillaceae",
                              genera: [
                                { name: "Penicillium", species: [{ name: "chrysogenum", file: "wonder_antibiotic.txt", wikiQuery: "Penicillium chrysogenum" }] },
                                { name: "Aspergillus", species: [{ name: "niger", file: "black_mold.txt", wikiQuery: "Aspergillus niger" }] }
                              ]
                            }
                          ]
                        }
                      ]
                    },
                    {
                      name: "Pezizomycetes",
                      orders: [
                        {
                          name: "Pezizales",
                          families: [
                            {
                              name: "Tuberaceae",
                              genera: [
                                { name: "Tuber", species: [{ name: "magnatum", file: "white_gold_truffle.txt", wikiQuery: "Tuber magnatum" }] }
                              ]
                            },
                            {
                              name: "Morchellaceae",
                              genera: [
                                { name: "Morchella", species: [{ name: "esculenta", file: "honeycomb_morel.txt", wikiQuery: "Morchella esculenta" }] }
                              ]
                            }

                        }
                      ]
                    },
                    {
                      name: "Sordariomycetes",
                      orders: [
                        {
                          name: "Hypocreales",
                          families: [
                            {
                              name: "Ophiocordycipitaceae",
                              genera: [
                                { name: "Ophiocordyceps", species: [{ name: "unilateralis", file: "zombie_ant_controller.txt", wikiQuery: "Ophiocordyceps unilateralis" }] }
                              ]
                            }
                          ]
                        }
                      ]
                    }
                  ]
                }
              ]
            }
          ]
        }
      ]
    };

    function buildTree(raw) {
      function parseNode(node) {
        const item = { name: node.name, type: "folder", children: [] };
        const keys = ["domains", "kingdoms", "phyla", "classes", "orders", "families", "genera"];
        let nextKey = keys.find(k => node[k]);

        if (nextKey) {
          item.children = node[nextKey].map(sub => parseNode(sub));
        } else if (node.species) {
          item.children = node.species.map(sp => {
            return {
              name: sp.name,
              type: "folder",
              children: [
                {
                  name: sp.file,
                  type: "file",
                  wikiQuery: sp.wikiQuery,
                  isTarget: !!sp.isTarget
                }
              ]
            };
          });
        }
        return item;
      }
      return parseNode(raw);
    }

    const fileSystem = buildTree(taxonomyData);
    let navStack = [fileSystem];

    let mistakes = 0;
    let secondsElapsed = 0;
    let timerRunning = true;

    setInterval(() => {
      if (!timerRunning) return;
      secondsElapsed++;
      const mins = String(Math.floor(secondsElapsed / 60)).padStart(2, "0");
      const secs = String(secondsElapsed % 60).padStart(2, "0");
      document.getElementById("timerVal").innerText = `${mins}:${secs}`;
    }, 1000);

    const gridEl = document.getElementById("grid");
    const breadcrumbEl = document.getElementById("breadcrumb");
    const backBtn = document.getElementById("backBtn");
    const modalEl = document.getElementById("modal");
    const modalTitle = document.getElementById("modalTitle");
    const modalContent = document.getElementById("modalContent");
    const wikiHeader = document.getElementById("wikiHeader");
    const wikiImg = document.getElementById("wikiImg");
    const wikiHeading = document.getElementById("wikiHeading");
    const wikiDescription = document.getElementById("wikiDescription");
    const mistakeValEl = document.getElementById("mistakeVal");
    const depthValEl = document.getElementById("depthVal");

    const correctPath = ["Root", "Eukaryota", "Animalia", "Chordata", "Mammalia", "Primates", "Hominidae", "Homo", "sapiens"];

    function renderView() {
      const current = navStack[navStack.length - 1];
      gridEl.innerHTML = "";

      breadcrumbEl.innerText = navStack.map(n => n.name).join(" / ");
      backBtn.disabled = navStack.length <= 1;
      depthValEl.innerText = `${navStack.length - 1} / 8`;

      if (!current.children || current.children.length === 0) {
        gridEl.innerHTML = `<div style="grid-column: 1/-1; color: var(--muted); text-align: center; padding: 40px;">(Empty rank level)</div>`;
        return;
      }

      current.children.forEach(child => {
        const node = document.createElement("div");
        node.className = "node";

        const icon = child.type === "folder" ? "📁" : (child.isTarget ? "🏆" : "📄");
        node.innerHTML = `
          <div class="node-icon">${icon}</div>
          <div class="node-name">${child.name}</div>
        `;

        node.addEventListener("click", () => {
          if (child.type === "folder") {
            const currentLevel = navStack.length;
            if (correctPath[currentLevel] && child.name !== correctPath[currentLevel]) {
              mistakes++;
              mistakeValEl.innerText = mistakes;
            }
            navStack.push(child);
            renderView();
          } else if (child.type === "file") {
            inspectFile(child);
          }
        });

        gridEl.appendChild(node);
      });
    }

    async function fetchWikipediaData(title) {
      try {
        const url = `https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(title)}`;
        const res = await fetch(url);
        if (!res.ok) throw new Error("Lookup fail");
        return await res.json();
      } catch (e) {
        return null;
      }
    }

    async function inspectFile(file) {
      if (file.isTarget) {
        timerRunning = false;
        modalTitle.innerText = "🏆 YOU CONQUERED THE TAXONOMY DUNGEON!";
        modalTitle.style.color = "var(--win)";
      } else {
        modalTitle.innerText = `📄 ${file.name}`;
        modalTitle.style.color = "var(--accent)";
      }

      wikiHeader.style.display = "none";
      modalContent.innerHTML = `<div style="display:flex; align-items:center; gap:8px;"><span class="spinner"></span> Querying Wikipedia API...</div>`;
      modalEl.classList.add("active");

      const wiki = await fetchWikipediaData(file.wikiQuery);

      if (wiki) {
        if (wiki.thumbnail && wiki.thumbnail.source) {
          wikiImg.src = wiki.thumbnail.source;
          wikiImg.style.display = "block";
        } else {
          wikiImg.style.display = "none";
        }

        wikiHeading.innerText = wiki.title || file.name;
        wikiDescription.innerText = wiki.description ? `(${wiki.description})` : "Taxon Entry";
        wikiHeader.style.display = "flex";

        let textOutput = "";
        if (file.isTarget) {
          textOutput += "=====================================================\n";
          textOutput += ">>> 🎯 WIN CONDITION ACHIEVED! 🎯 <<<\n";
          textOutput += `Total Time: ${document.getElementById("timerVal").innerText}\n`;
          textOutput += `Wrong Branches Chosen: ${mistakes}\n`;
          textOutput += "Full Path: Archaea/Bacteria/Eukaryota -> Eukaryota -> Animalia -> Chordata -> Mammalia -> Primates -> Hominidae -> Homo -> sapiens\n";
          textOutput += "=====================================================\n\n";
        }

        textOutput += `[SOURCE: Wikipedia REST API]\n\n${wiki.extract}\n\n`;
        textOutput += `Wikipedia Article: ${wiki.content_urls ? wiki.content_urls.desktop.page : `https://en.wikipedia.org/wiki/${file.wikiQuery}`}`;

        modalContent.innerText = textOutput;
      } else {
        modalContent.innerText = `[File: ${file.name}]\n\nFailed to pull Wikipedia extract.\nScientific Query: ${file.wikiQuery}`;
      }
    }

    function closeModal() {
      modalEl.classList.remove("active");
    }

    backBtn.addEventListener("click", () => {
      if (navStack.length > 1) {
        navStack.pop();
        renderView();
      }
    });

    renderView();
  </script>
